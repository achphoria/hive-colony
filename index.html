<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hive Colony</title>
  <link rel="stylesheet" href="assets/office.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <div class="mark">HIVE COLONY</div>
        <h1>Kantor vertikal</h1>
        <p class="sub" id="floor-title">7 lantai, 28 peran</p>
      </div>
      <div class="pill">Desain · agen menyusul</div>
    </header>
    <main class="stage">
      <div class="building-wrap">
        <div class="building" id="building"></div>
      </div>
      <aside class="side">
        <h2>Lantai</h2>
        <div class="floors" id="floors"></div>
        <div class="roster" id="roster"></div>
        <div class="card" id="card"></div>
        <p class="note">Satu tubuh untuk semua orang. Rambut, pakaian, dan aksesori yang membedakan. Lift mengikuti lantai yang dipilih. Status kerja belum disambung ke agen.</p>
      </aside>
    </main>
  </div>
  <script type="module" src="assets/office.js"></script>
</body>
</html>
